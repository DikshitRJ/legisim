openapi: 3.0.3
info:
  title: Notebooks API
  version: 1.0.0
  description: API for managing Notebooks and their statuses.
paths:
  /api/notebooks:
    get:
      summary: List notebooks
      description: Retrieves a list of notebooks, optionally filtered by status.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - archived
          required: false
          description: Filter by status
      responses:
        '200':
          description: A list of notebooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notebook'
    post:
      summary: Create a new notebook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotebookCreate'
      responses:
        '201':
          description: Notebook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
  /api/notebooks/{id}:
    parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: Notebook ID
    get:
      summary: Get single notebook
      responses:
        '200':
          description: Notebook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
    put:
      summary: Update notebook details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotebookUpdate'
      responses:
        '200':
          description: Notebook updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
    delete:
      summary: Archive a notebook
      responses:
        '200':
          description: Notebook archived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
components:
  schemas:
    NotebookStatus:
      type: string
      enum:
        - active
        - archived
      description: Lifecycle status of a simulation notebook.
    Notebook:
      type: object
      required:
        - id
        - title
        - description
        - sources
        - modifiedAt
        - status
      properties:
        id:
          type: string
          description: Unique identifier for the notebook.
        title:
          type: string
          description: Human-readable title of the notebook.
        description:
          type: string
          description: Detailed description of the notebook.
        sources:
          type: integer
          description: Number of sources attached to the notebook.
        modifiedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp of last modification.
        status:
          $ref: '#/components/schemas/NotebookStatus'
    NotebookCreate:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
        description:
          type: string
    NotebookUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
