# ==============================================================================
# LegiSim – Single Docker Compose
# ==============================================================================
# Boot the entire stack:  docker compose up --build
# Tear down:              docker compose down -v
# ==============================================================================

services:
  # ============================================================================
  # 1. Reverse Proxy: Traefik
  # ============================================================================
  traefik:
    image: traefik:v3.6
    environment:
      - DOCKER_API_VERSION=1.41
    container_name: legisim-traefik
    user: "root"
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8088}:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    security_opt:
      - label:disable
    networks:
      - legisim-network
    restart: unless-stopped

  # ============================================================================
  # 2. Database: PostgreSQL 16 + pgvector
  # ============================================================================
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: legisim-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legisim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legisim_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-legisim}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "pg-data:/var/lib/postgresql/data"
      - "./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro,Z"
    networks:
      - legisim-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legisim} -d ${POSTGRES_DB:-legisim}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ============================================================================
  # 3. Cache & Pub/Sub: Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: legisim-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - "redis-data:/data"
    networks:
      - legisim-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ============================================================================
  # 4. Object Storage: LocalStack (S3)
  # ============================================================================
  localstack:
    image: localstack/localstack:3.0.0
    container_name: legisim-localstack
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-test}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-test}
    ports:
      - "4566:4566"
    volumes:
      - "localstack-data:/var/lib/localstack"
      - "./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro,z"
    networks:
      - legisim-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.s3.rule=Host(`s3.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.s3.entrypoints=web"
      - "traefik.http.services.s3.loadbalancer.server.port=4566"
    restart: unless-stopped

  # ============================================================================
  # 6. Core Application: FastAPI Backend (+ LangGraph engine in-process)
  # ============================================================================
  fastapi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legisim-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-legisim}:${POSTGRES_PASSWORD:-legisim_db_pass}@postgres:5432/${POSTGRES_DB:-legisim}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      S3_ENDPOINT: localstack:4566
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-legisim-data}
      S3_USE_SSL: "false"
      SEARXNG_URL: http://searxng:8080
      LAYA_SERVICE_URL: http://laya:8001/predict
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      LANGFUSE_PUBLIC_KEY: pk-lf-1234567890
      LANGFUSE_SECRET_KEY: sk-lf-1234567890
      LANGFUSE_HOST: http://langfuse:3000
    volumes:
      # Mount personas data so the engine population loader can find them
      - "./personas:/app/personas:ro,z"
      - "./data:/app/data:ro,z"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - legisim-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN:-localhost}`) || PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ============================================================================
  # 7. Web Search: SearXNG
  # ============================================================================
  searxng:
    image: searxng/searxng:latest
    container_name: legisim-searxng
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    environment:
      BASE_URL: "http://${DOMAIN:-localhost}:${SEARXNG_PORT:-8080}/"
      INSTANCE_NAME: "legisim-searxng"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`search.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.searxng.entrypoints=web"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./docker/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    networks:
      - legisim-network
    restart: unless-stopped

  # ============================================================================
  laya:
    image: dummy-laya:latest # TODO real image
    container_name: legisim-laya
    ports:
      - "8001:8001"
    networks:
      - legisim-network
    restart: unless-stopped

  # 8. Web Client: Next.js Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legisim-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      BACKEND_URL: http://fastapi-backend:8000
      NEXT_PUBLIC_API_BASE_URL: ""
    depends_on:
      fastapi-backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-localhost}`) || Host(`app.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - legisim-network
    restart: unless-stopped

  # ============================================================================
  # 9. Email Testing: Mailpit
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: legisim-mailpit
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mail.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    networks:
      - legisim-network
    restart: unless-stopped

  # ============================================================================
  # 10. Observability: Langfuse
  # ============================================================================
  langfuse:
    image: langfuse/langfuse:2
    container_name: legisim-langfuse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3030}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-legisim}:${POSTGRES_PASSWORD:-legisim_db_pass}@postgres:5432/langfuse
      - NEXTAUTH_SECRET=legisim_langfuse_secret
      - SALT=legisim_langfuse_salt
      - NEXTAUTH_URL=http://localhost:${LANGFUSE_PORT:-3030}
      - TELEMETRY_ENABLED=false
      - LANGFUSE_INIT_ORG_ID=legisim
      - LANGFUSE_INIT_ORG_NAME=Legisim
      - LANGFUSE_INIT_PROJECT_ID=legisim
      - LANGFUSE_INIT_PROJECT_NAME=Legisim
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=pk-lf-1234567890
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=sk-lf-1234567890
      - LANGFUSE_INIT_USER_EMAIL=admin@legisim.local
      - LANGFUSE_INIT_USER_PASSWORD=admin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.langfuse.rule=Host(`langfuse.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.langfuse.entrypoints=web"
      - "traefik.http.services.langfuse.loadbalancer.server.port=3000"
    networks:
      - legisim-network
    restart: unless-stopped

# ==============================================================================
# Networks
# ==============================================================================
networks:
  legisim-network:
    name: legisim-network
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  pg-data:
    name: legisim-pg-data
  redis-data:
    name: legisim-redis-data
  localstack-data:
    name: legisim-localstack-data
