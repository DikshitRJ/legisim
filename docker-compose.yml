# ==============================================================================
# LegiSim – Single Docker Compose
# ==============================================================================
# Boot the entire stack:  docker compose up --build
# Tear down:              docker compose down -v
# ==============================================================================

services:
  # ============================================================================
  # 1. Reverse Proxy: Traefik
  # ============================================================================
  traefik:
    image: traefik:v2.10
    container_name: legisim-traefik
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8088}:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - legisim-network
    restart: unless-stopped

  # ============================================================================
  # 2. Database: PostgreSQL 16 + pgvector
  # ============================================================================
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: legisim-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legisim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legisim_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-legisim}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "pg-data:/var/lib/postgresql/data"
      - "./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro"
    networks:
      - legisim-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legisim} -d ${POSTGRES_DB:-legisim}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ============================================================================
  # 3. Cache & Pub/Sub: Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: legisim-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - "redis-data:/data"
    networks:
      - legisim-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ============================================================================
  # 4. Object Storage: MinIO
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: legisim-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin_pass}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "minio-data:/data"
    networks:
      - legisim-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`s3.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`minio.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
    restart: unless-stopped

  # ============================================================================
  # 5. MinIO Bucket Initialization (one-shot init container)
  # ============================================================================
  minio-create-bucket:
    image: minio/mc:RELEASE.2023-11-20T16-30-59Z
    container_name: legisim-minio-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-minio_admin_pass};
      /usr/bin/mc mb --ignore-existing myminio/${S3_BUCKET_NAME:-legisim-data};
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET_NAME:-legisim-data} || true;
      exit 0;
      "
    networks:
      - legisim-network

  # ============================================================================
  # 6. Core Application: FastAPI Backend (+ LangGraph engine in-process)
  # ============================================================================
  fastapi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legisim-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-legisim}:${POSTGRES_PASSWORD:-legisim_db_pass}@postgres:5432/${POSTGRES_DB:-legisim}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_admin_pass}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-legisim-data}
      S3_USE_SSL: "false"
      SEARXNG_URL: http://searxng:8080
      JEV_SERVICE_URL: http://localhost:8001/predict
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
    volumes:
      # Mount personas data so the engine population loader can find them
      - "./personas:/app/personas:ro"
      - "./data:/app/data:ro"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - legisim-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN:-localhost}`) || PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ============================================================================
  # 7. Web Search: SearXNG
  # ============================================================================
  searxng:
    image: searxng/searxng:latest
    container_name: legisim-searxng
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    environment:
      BASE_URL: "http://${DOMAIN:-localhost}:${SEARXNG_PORT:-8080}/"
      INSTANCE_NAME: "legisim-searxng"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`search.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.searxng.entrypoints=web"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
    networks:
      - legisim-network
    restart: unless-stopped

  # ============================================================================
  # 8. Web Client: Next.js Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legisim-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://fastapi-backend:8000
    depends_on:
      fastapi-backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-localhost}`) || Host(`app.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - legisim-network
    restart: unless-stopped

  # ============================================================================
  # 9. Email Testing: Mailpit
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: legisim-mailpit
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mail.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    networks:
      - legisim-network
    restart: unless-stopped

# ==============================================================================
# Networks
# ==============================================================================
networks:
  legisim-network:
    name: legisim-network
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  pg-data:
    name: legisim-pg-data
  redis-data:
    name: legisim-redis-data
  minio-data:
    name: legisim-minio-data
