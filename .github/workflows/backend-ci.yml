name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "docker/**"
      - "docker-compose.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "docker/**"
      - "docker-compose.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Phase 1: Code Quality (Ruff & Mypy)
  # ============================================================================
  code-quality:
    name: Phase 1 - Code Quality (Ruff & Mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Type Checking Dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check backend/

      - name: Run Mypy Type Checker
        run: |
          cd backend
          mypy app

  # ============================================================================
  # Phase 2: Tests with PostgreSQL (pgvector) and Redis Services
  # ============================================================================
  tests:
    name: Phase 2 - Integration & Unit Tests (Pytest)
    needs: code-quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: legisim
          POSTGRES_PASSWORD: legisim_db_pass
          POSTGRES_DB: legisim
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Application & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -e ".[dev]"

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://legisim:legisim_db_pass@localhost:5432/legisim
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-12345
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://legisim:legisim_db_pass@localhost:5432/legisim
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-12345
        run: |
          cd backend
          pytest -v
